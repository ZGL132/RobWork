# 工业机械臂重构·Windows x64 CI 门禁（WP-01-T04，2026-08-31 所有者裁决双文件口径）
# 本文件为门禁契约定义：GitLab Windows Runner 接入前豁免实际执行（WP-01 计划 §9），
# 执行通道＝.github/workflows/industrial-robot-windows.yml（步骤顺序、job 划分、缓存
# 白名单与脚本行逐字符一致）。
# 步骤固定：checkout → VS x64 → configure → build → 模型测试 → GUI 规则通道预检 →
#           check-boundaries → package → 上传日志/CTest XML/边界报告/安装 manifest。
# 模型与 GUI 分离 job；GUI job 显式声明 QT_QPA_PLATFORM=windows（本机 GL 平台）执行。
# 测试面（2026-10-12 治理批扩面，G-1 消账）：两测试 job 的 run-tests 正则由阶段 A 的
# '^sdurws_ird_core_test$'（WP-01-T02 交付时点唯一已建测试目标的历史口径）扩为
# '^sdurws_ird_.*_test$'——覆盖全部单元 sdurws_ird_<unit>_test 与 sdurws_ird_<unit>_contract_test
# 注册目标，与本地 gate-all.ps1"全部 _test/_contract_test 一键执行"面拉齐。扩面依据：
# units/execution.md §15.4 v0.12（EX-T10 ④）、units/runtime.md §15.4 v0.15（RT-T13 ④）、
# units/evidence.md EV-T12 三处同缺口登记（均请求 CI 执行面扩至全部单元）。
# CMAKE_PREFIX_PATH 双声明（WP-01 计划 §5.5）：本地＝操作员会话导出，CI＝本 variables 声明；
# 入口脚本对前缀只记录不修改。缓存白名单仅 .cache/industrial-robot/{dependencies,packages}/，
# 不缓存正式测试结果、结果数据库或项目快照；失败工件 when: always。
# 集成默认分支保护：redesign-main 仅接受本门禁（六步全绿）的合并（仓库分支保护设置）。
#
# ★ 2026-10-16 激活修订（gov-ci-activation，所有者裁决"按建议激活"；与 GitHub 执行
#   通道的脚本行逐字符一致纪律保持），本文件两处变更：
#   1) 依赖供给清单补 gtest——理由与 GitHub 通道相同（今日树 find_package(GTest
#      CONFIG REQUIRED)，自 WP-02-T01 起；2026-08-31 验证运行尚无此需求）。rules
#      触发面保持既有"任意分支＋MR"口径未动：GitLab Windows Runner 尚未接入、
#      本文件处于豁免执行状态（WP-01 计划 §9），触发面收窄待 Runner 接入时随
#      接入契约一并裁决。
#   2) 六个入口脚本正式落位 RobWork/scripts/industrial-robot/（eb777e2 参考实现＋
#      今日树适配）——适配明细见 ci/README.md「2026-10-16 激活」节与
#      patches/PATCHES.md 0003 号。
#   3) 依赖供给守卫＝清单末项（boost_tuple 头文件）＋依赖清单补 15 个 boost 仅头
#      文件端口——缓存前缀回退会容忍清单变更后命中旧树，守卫指向既装包即短路跳过
#      新增端口安装（GitHub 通道 run 38947428868/38948093498 两轮实证）。约定：今后
#      扩依赖清单时守卫同步指向新末项；boost 缺口盘点＝框架源码全量 include 扫描。

stages:
  - industrial-robot-gate

variables:
  CMAKE_PREFIX_PATH: "$CI_PROJECT_DIR/.cache/industrial-robot/dependencies/vcpkg/installed/x64-windows"

.industrial-robot-gate-job:
  stage: industrial-robot-gate
  tags:
    - windows
    - x64
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  cache:
    key: industrial-robot-dependencies
    policy: pull-push
    when: always
    paths:
      - .cache/industrial-robot/dependencies/
      - .cache/industrial-robot/packages/
  before_script:
    - 'Write-Output "checkout: $CI_COMMIT_SHA ($CI_COMMIT_REF_NAME)"'
    - 'Write-Output "VS x64: cl.exe/cmake.exe/ctest.exe 由入口脚本发现并初始化（VsDevCmd -arch=x64 -host_arch=x64，找不到 VS x64 立即失败）"'
    - >-
      if (-not (Test-Path '.cache/industrial-robot/dependencies/vcpkg/installed/x64-windows/include/boost/tuple/tuple.hpp')) { & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install qtbase boost-filesystem boost-system boost-thread boost-program-options boost-date-time eigen3 qhull zlib libzip bzip2 gtest pugixml expat boost-algorithm boost-asio boost-bind boost-function boost-graph boost-lambda boost-math boost-mpl boost-multi-index boost-numeric-conversion boost-property-tree boost-random boost-serialization boost-spirit boost-tuple --triplet x64-windows --x-install-root "$PWD/.cache/industrial-robot/dependencies/vcpkg/installed" }
    - |
      New-Item -ItemType Directory -Force "$PWD/RobWork/RobWorkStudio/bin" | Out-Null
      @'
      [Plugins]

      UserPlugin\DockArea=2
      UserPlugin\Filename=library_filename_without_extension
      UserPlugin\Path=unix_style_path_to_library
      UserPlugin\Visible=true

      [Settings]
      Workcell\Path=path/to/workcell.xml
      '@ | Set-Content -Path "$PWD/RobWork/RobWorkStudio/bin/RobWorkStudio.ini.template.static" -Encoding Ascii
      @'
      [Plugins]

      @Luapl_DOCKAREA@
      @Luapl_FILENAME@
      @Luapl_PATH@
      @Luapl_VISIBLE@

      @Sensors_DOCKAREA@
      @Sensors_FILENAME@
      @Sensors_PATH@
      @Sensors_VISIBLE@

      @Jog_DOCKAREA@
      @Jog_FILENAME@
      @Jog_PATH@
      @Jog_VISIBLE@

      @Log_DOCKAREA@
      @Log_FILENAME@
      @Log_PATH@
      @Log_VISIBLE@

      @Planning_DOCKAREA@
      @Planning_FILENAME@
      @Planning_PATH@
      @Planning_VISIBLE@

      @PlayBack_DOCKAREA@
      @PlayBack_FILENAME@
      @PlayBack_PATH@
      @PlayBack_VISIBLE@

      @PropertyView_DOCKAREA@
      @PropertyView_FILENAME@
      @PropertyView_PATH@
      @PropertyView_VISIBLE@

      @TreeView_DOCKAREA@
      @TreeView_FILENAME@
      @TreeView_PATH@
      @TreeView_VISIBLE@
      '@ | Set-Content -Path "$PWD/RobWork/RobWorkStudio/bin/RobWorkStudio.ini.shared.in" -Encoding Ascii
  artifacts:
    when: always
    paths:
      - out/build/industrial-robot/
      - out/logs/industrial-robot/

ird-industrial-robot-configure:
  extends: .industrial-robot-gate-job
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\RobWork\scripts\industrial-robot\configure.ps1 -Configuration Release

ird-industrial-robot-build:
  extends: .industrial-robot-gate-job
  needs:
    - job: ird-industrial-robot-configure
      artifacts: true
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\RobWork\scripts\industrial-robot\build.ps1 -Configuration Release -NoConfigure

ird-industrial-robot-model-tests:
  extends: .industrial-robot-gate-job
  needs:
    - job: ird-industrial-robot-build
      artifacts: true
  script:
    # 测试面扩全部单元（2026-10-12 治理批，G-1 消账——依据 execution.md v0.12④／
    # runtime.md v0.15④／evidence.md EV-T12 同缺口登记）：'^sdurws_ird_.*_test$' 覆盖
    # 全部单元 _test 与 _contract_test 注册目标，与 gate-all.ps1 全量测试面对齐。
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\RobWork\scripts\industrial-robot\run-tests.ps1 -Configuration Release -Regex '^sdurws_ird_.*_test$' -NoConfigure

ird-industrial-robot-gui-precheck:
  extends: .industrial-robot-gate-job
  needs:
    - job: ird-industrial-robot-model-tests
      artifacts: true
  variables:
    QT_QPA_PLATFORM: windows
  script:
    # GUI job 同批扩面（2026-10-12 治理批，G-1 消账）：正则与模型测试 job 一致——
    # 阶段 A"唯一已构建测试"的冻结前提已消失，QT_QPA_PLATFORM=windows 保持显式声明。
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\RobWork\scripts\industrial-robot\run-tests.ps1 -Configuration Release -Regex '^sdurws_ird_.*_test$' -NoConfigure

ird-industrial-robot-boundaries:
  extends: .industrial-robot-gate-job
  needs:
    - job: ird-industrial-robot-gui-precheck
      artifacts: true
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\RobWork\scripts\industrial-robot\check-boundaries.ps1

ird-industrial-robot-package:
  extends: .industrial-robot-gate-job
  needs:
    - job: ird-industrial-robot-boundaries
      artifacts: true
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\RobWork\scripts\industrial-robot\package.ps1 -Configuration Release
